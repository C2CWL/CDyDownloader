name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: cdy-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: |
          sdkmanager --install "platforms;android-37" >/dev/null
          sdkmanager --install "build-tools;37.0.0" >/dev/null 2>&1 || \
          sdkmanager --install "build-tools;36.0.0" >/dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CDy-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
