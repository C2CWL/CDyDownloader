name: Android APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: cdy-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK packages
        run: |
          S=$(ls $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $S"
          yes | "$S" --licenses > /dev/null 2>&1 || true
          "$S" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo '--- platforms ---'; ls "$ANDROID_SDK_ROOT/platforms"
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ] && [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
            echo 'symlinked android-37 -> android-37.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Test media parsing and link handling
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CDy-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
