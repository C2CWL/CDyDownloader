name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: cdy-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(ls $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" > /dev/null
          "$SDKMANAGER" --install "build-tools;37.0.0" > /dev/null 2>&1 || \
          "$SDKMANAGER" --install "build-tools;36.0.0" > /dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CDy-arm64-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
